name: Build, Push and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    # ⚠️ ต้องมี postgres ที่นี่ด้วย ไม่ใช่แค่ใน ci.yml
    #
    # เราทำงานบน main โดยตรง และ ci.yml ตั้ง branches-ignore: [main] ไว้
    # แปลว่า integration test ไม่เคยรันบน CI เลยสำหรับงานที่ push ขึ้น main
    # ซึ่งเป็นเส้นทางหลักที่ deploy ขึ้น production จริง
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: vertex
          POSTGRES_PASSWORD: vertex
          POSTGRES_DB: vertex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vertex"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: ตรวจว่าไม่มีความลับหลุดเข้า repo
        run: ./scripts/check-secrets.sh

      # SQL อยู่คนละ repo — ดึงมาเพื่อเตรียมฐานข้อมูลให้ integration test
      - name: Checkout migrations
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/vertex-migrations
          path: .migrations
          token: ${{ secrets.MIGRATIONS_REPO_TOKEN || github.token }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: go vet
        run: |
          go vet ./...
          go vet -tags=integration ./...
      - name: Test (race)
        run: go test -race -count=1 ./...
      # ⚠️ .golangci.yml ใช้ config schema version 2 จึงต้องใช้ golangci-lint v2
      #    action v6 ผูกกับ v1.x ที่ build ด้วย Go 1.23
      #    อ่านโปรเจกต์ที่ target Go 1.25 ไม่ได้ → CI ล้มทั้ง pipeline
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Flyway migrate
        run: |
          set -euo pipefail
          docker run --rm --network host \
            -v "$PWD/.migrations/pet/migration:/flyway/sql/migration:ro" \
            -v "$PWD/.migrations/pet/codeowned:/flyway/sql/codeowned:ro" \
            -v "$PWD/.migrations/pet/seed:/flyway/sql/seed:ro" \
            -e FLYWAY_URL=jdbc:postgresql://localhost:5432/vertex \
            -e FLYWAY_USER=vertex -e FLYWAY_PASSWORD=vertex \
            -e FLYWAY_SCHEMAS=pet -e FLYWAY_DEFAULT_SCHEMA=pet \
            -e FLYWAY_LOCATIONS=filesystem:/flyway/sql/migration,filesystem:/flyway/sql/codeowned,filesystem:/flyway/sql/seed \
            -e FLYWAY_FAIL_ON_MISSING_LOCATIONS=true \
            -e FLYWAY_CLEAN_DISABLED=true \
            flyway/flyway:11-alpine migrate

      # gate ที่สำคัญที่สุดก่อนขึ้น production
      #
      # ครอบ schema ตรงกับ GORM model, authorization matrix, outbox,
      # pagination และ avatar — ทั้งหมดต้องผ่านก่อนถึงจะ build image
      - name: Integration test
        env:
          TEST_DATABASE_URL: postgres://vertex:vertex@localhost:5432/vertex?sslmode=disable&search_path=pet
        run: |
          set -euo pipefail
          go test -race -count=1 -tags=integration -coverpkg=./... -coverprofile=coverage.out ./...

      # coverage ต้องไม่ต่ำกว่าเพดานล่าง
      #
      # ⚠️ ต้องใช้ -coverpkg=./... ตอนวัด ไม่งั้นตัวเลขจะต่ำกว่าความจริงมาก
      #    เพราะ integration test อยู่ใน package bootstrap แต่เรียกโค้ดใน
      #    repository/application ซึ่ง Go ไม่นับให้ถ้าไม่ระบุ
      #    (วัดแบบไม่ใส่ได้ 41.7% แบบใส่ได้ 71.9% จากโค้ดชุดเดียวกัน)
      - name: Coverage gate
        env:
          MIN_COVERAGE: "80"
        run: |
          set -euo pipefail
          pct=$(go tool cover -func=coverage.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          echo "coverage = ${pct}%  (เพดานล่าง ${MIN_COVERAGE}%)"
          awk -v got="$pct" -v min="$MIN_COVERAGE" \
            'BEGIN { if (got + 0 < min + 0) { print "::error::coverage ต่ำกว่าเพดานล่าง"; exit 1 } }'

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver: docker-container

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # สแกน image ที่จะ deploy จริง ไม่ใช่แค่ dependency ใน go.mod
      #
      # govulncheck ครอบเฉพาะโค้ด Go ส่วน Trivy เห็น base image และ
      # ไลบรารีระบบที่ติดมาด้วย ซึ่ง govulncheck มองไม่เห็น
      #
      # นับเฉพาะ CRITICAL/HIGH ที่มีทางแก้แล้ว (ignore-unfixed)
      # ไม่งั้น CVE ที่ยังไม่มี patch จะทำให้ deploy ไม่ได้ทั้งที่ทำอะไรไม่ได้
      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true


  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Create kubeconfig from secret
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG_CONTENT }}
        run: |
          mkdir -p ~/.kube
          # ใช้ printf %s แทน echo — echo แปลง backslash ใน YAML เพี้ยนได้ (O-6)
          # ถ้าเก็บ secret เป็น base64 ให้เปลี่ยนเป็น: printf %s "$KUBECONFIG_CONTENT" | base64 -d > ~/.kube/config
          printf '%s' "$KUBECONFIG_CONTENT" > ~/.kube/config
          chmod 600 ~/.kube/config
          grep -q 'apiVersion' ~/.kube/config || { echo "kubeconfig ว่างหรือไม่ valid"; exit 1; }

      - name: Set KUBECONFIG environment variable
        run: echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Verify cluster access
        run: |
          kubectl version --client
          kubectl get pods -n vertex

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.12.0'

      - name: Set default namespace in kubeconfig
        run: |
          kubectl config set-context --current --namespace vertex

      - name: Deploy using Helm
        id: helm_deploy
        run: |
          # pipefail สำคัญมาก — ถ้าไม่ใส่ exit code ที่ได้จะเป็นของ tee (0 เสมอ)
          # helm upgrade ล้มเหลวแล้ว job ยังขึ้นเขียว ทำให้ deploy ไม่ขึ้นจริง
          # โดยไม่มีใครรู้ (เกิดขึ้นจริงกับ commit 04d1a4f)
          set -euo pipefail
          helm upgrade --install pet-service ./helm/pet-service \
            --namespace vertex \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set image.tag=sha-${{ github.sha }} \
            --set forceTimestamp=$(date +%s) | tee helm-output.txt

      - name: Rollout restart if no change
        run: |
          set -euo pipefail
          if grep -q 'unchanged' helm-output.txt; then
            echo "No changes detected, restarting deployment..."
            kubectl rollout restart deployment pet-service -n vertex
          else
            echo "Changes detected, no restart required."
          fi

      # ยืนยันว่า deploy ขึ้นจริง ไม่ใช่แค่ helm ไม่ error
      - name: Verify rollout
        run: |
          set -euo pipefail
          kubectl rollout status deployment/pet-service -n vertex --timeout=180s

          want="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}"
          got=$(kubectl get deployment pet-service -n vertex \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "ต้องการ: $want"
          echo "ได้จริง: $got"
          if [ "$want" != "$got" ]; then
            echo "::error::image ที่รันอยู่ไม่ตรงกับ commit นี้ — deploy ไม่ขึ้นจริง"
            exit 1
          fi
