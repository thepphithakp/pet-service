# =============================================================================
# Flyway config พื้นฐาน — ค่าที่เป็นความลับให้ override ด้วย env (FLYWAY_URL ฯลฯ)
# =============================================================================

flyway.schemas=pet
flyway.defaultSchema=pet
flyway.table=flyway_schema_history

# migration/  = V__ (DDL + seed ครั้งแรก)
# codeowned/  = R__ เฉพาะตารางที่ backoffice แก้ไม่ได้
# 🚫 ห้ามใส่ db/seed ที่นี่ — เป็นข้อมูลตัวอย่างสำหรับ local เท่านั้น
flyway.locations=filesystem:/flyway/sql/migration,filesystem:/flyway/sql/codeowned

# database ที่มีข้อมูลอยู่แล้วและยังไม่มี history table:
#   Flyway จะ baseline ที่ version 1 แล้ว "ข้าม" V1 (mark ว่า applied โดยไม่รัน)
#   จากนั้นรัน V2 ขึ้นไป → schema เดิมไม่ถูกแตะเลย
# database เปล่า (local/CI): ไม่มีอะไรให้ baseline, V1 รันปกติ
#
# ⚠️ หลัง prod baseline สำเร็จแล้ว ควรเปลี่ยนเป็น false
#    เพื่อไม่ให้เผลอ baseline database ผิดตัวในอนาคต
flyway.baselineOnMigrate=true
flyway.baselineVersion=1

flyway.validateOnMigrate=true
flyway.outOfOrder=false

# 🚫 ห้ามเปลี่ยนเป็น false เด็ดขาดในทุก environment
flyway.cleanDisabled=true

flyway.connectRetries=20
