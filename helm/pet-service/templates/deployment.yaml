apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pet-service.fullname" . }}
  labels:
    {{- include "pet-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # ตั้ง replicas เฉพาะตอนไม่ได้เปิด HPA ไม่งั้น helm กับ HPA จะแย่งกันตั้งค่า
  # แล้ว pod จะถูก scale ขึ้นลงทุกครั้งที่ deploy
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pet-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "pet-service.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "pet-service.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            # พอร์ตเดียวกันหมดทั้ง compose / helm / default ในโค้ด (แก้ C-14)
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: DB_HOST
              value: {{ .Values.db.host | quote }}
            - name: DB_PORT
              value: {{ .Values.db.port | quote }}
            - name: DB_NAME
              value: {{ .Values.db.name | quote }}
            - name: DB_SSLMODE
              value: {{ .Values.db.sslMode | quote }}
            - name: DB_SEARCH_PATH
              value: {{ .Values.db.searchPath | quote }}
            - name: SHUTDOWN_DRAIN_DELAY
              value: {{ .Values.shutdown.drainDelay | quote }}
            - name: SHUTDOWN_TIMEOUT
              value: {{ .Values.shutdown.timeout | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.credentialsSecret }}
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.credentialsSecret }}
                  key: password
            {{- if .Values.jwt.publicKeysSecret }}
            - name: JWT_PUBLIC_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.jwt.publicKeysSecret }}
                  key: keys
            {{- end }}
            {{- if .Values.jwt.issuer }}
            - name: JWT_ISSUER
              value: {{ .Values.jwt.issuer | quote }}
            {{- end }}
            {{- if .Values.jwt.audience }}
            - name: JWT_AUDIENCE
              value: {{ .Values.jwt.audience | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
