replicaCount: 1

image:
  repository: ghcr.io/thepphithakp/pet-service
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: "vertex-sa"

podAnnotations: {}

# --- Security context ----------------------------------------------------
# เดิมทั้งสองอันเป็น {} ทำให้ container รันเป็น root (S-7)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 4001

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 500m
    # 128Mi ต่ำเกินไปตราบใดที่ list API ยังส่ง avatar blob กลับ (P-1)
    # ลดลงได้หลัง Phase 5.1
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

terminationGracePeriodSeconds: 30

# --- Database -------------------------------------------------------------
db:
  host: postgres
  port: 5432
  name: vertex_pet
  sslMode: disable
  schema: pet
  # ⚠️ ระหว่างย้าย schema ต้องเป็น "pet,public" และ deploy ค่านี้ให้ขึ้นก่อน
  #    แล้วค่อยรัน db/bootstrap/001_move_to_pet_schema.sql
  #    เปลี่ยนเป็น "pet" อย่างเดียวได้เมื่อ auth/event ย้ายเสร็จแล้ว
  searchPath: "pet,public"
  # Secret ที่เก็บ credential ของ runtime (สิทธิ์ DML เท่านั้น ไม่มี DDL)
  credentialsSecret: pet-db-app

# --- Flyway migration job -------------------------------------------------
migration:
  enabled: true
  image:
    repository: ghcr.io/thepphithakp/pet-service-migrations
    # ว่างไว้ = ใช้ tag เดียวกับ app image เพื่อให้ schema กับโค้ดตรงกันเสมอ
    tag: ""
  # Secret ที่เก็บ credential ของ migrator (มีสิทธิ์ DDL)
  credentialsSecret: pet-db-migrator
  # ⚠️ เปลี่ยนเป็น false หลัง prod baseline สำเร็จแล้ว
  #    เพื่อไม่ให้เผลอ baseline database ผิดตัวในอนาคต
  baselineOnMigrate: true
  backoffLimit: 1
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- Application env ------------------------------------------------------
env:
  - name: EVENT_SERVICE_URL
    value: "http://event-service:4002"
  - name: LOG_LEVEL
    value: "info"
