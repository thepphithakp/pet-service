replicaCount: 1

image:
  repository: ghcr.io/thepphithakp/pet-service
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  annotations: {}
  name: "vertex-sa"

podAnnotations: {}

# --- Security context ----------------------------------------------------
# เดิมทั้งสองอันเป็น {} ทำให้ container รันเป็น root (S-7)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 4001

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources:
  limits:
    cpu: 500m
    # 128Mi ต่ำเกินไปตราบใดที่ list API ยังส่ง avatar blob กลับ (P-1)
    # ลดลงได้หลัง Phase 5.1
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# --- Lifecycle ---
#
# ⚠️ ค่าเหล่านี้สัมพันธ์กัน ห้ามแก้ตัวเดียวโดยไม่ดูตัวอื่น
#
#   SHUTDOWN_DRAIN_DELAY (5s)
#     > readinessProbe.periodSeconds × failureThreshold (5×2 = 10s)  ← ยังไม่พอ ดูหมายเหตุ
#   SHUTDOWN_DRAIN_DELAY + SHUTDOWN_TIMEOUT (5+20 = 25s)
#     < terminationGracePeriodSeconds (45s)  ✅ ไม่งั้นโดน SIGKILL ก่อนปิดเสร็จ
#
# หมายเหตุ: จริงๆ แล้ว k8s ถอด endpoint ทันทีที่ pod เข้าสถานะ Terminating
# ไม่ต้องรอ readinessProbe fail ครบ failureThreshold
# DrainDelay จึงมีไว้รอให้ kube-proxy ทุก node อัปเดต iptables ตามเท่านั้น
# 5 วินาทีพอสำหรับคลัสเตอร์ขนาดนี้
terminationGracePeriodSeconds: 45

# livenessProbe จงใจไม่เช็ค DB
# ถ้าเช็คแล้ว DB ล่ม k8s จะฆ่าทุก pod พร้อมกันแล้ววนรีสตาร์ตไม่จบ
livenessProbe:
  httpGet:
    path: /livez
    port: http
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

# readinessProbe เช็ค DB — ล้มแล้วแค่ถูกถอดออกจาก endpoints ไม่ถูกฆ่า
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

# startupProbe ให้เวลา pod ตอนบูต (ต่อ DB + ตรวจ schema version)
# ระหว่างนี้ liveness ยังไม่ทำงาน จึงไม่โดนฆ่าเพราะบูตช้า
startupProbe:
  httpGet:
    path: /livez
    port: http
  periodSeconds: 2
  failureThreshold: 30

# --- Observability ---
#
# ServiceMonitor ให้ Prometheus Operator ในคลัสเตอร์มาดึง /metrics
# /metrics ไม่ได้เปิดออกภายนอก เพราะ ingress route แค่ prefix /api/v1
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  # ปล่อยว่าง = สร้างใน namespace เดียวกับ release
  namespace: ""
  # Prometheus ในคลัสเตอร์นี้ตั้ง serviceMonitorSelector ไว้ที่
  #   matchLabels: {release: prometheus-grafana}
  # ถ้าไม่ใส่ label นี้ ServiceMonitor จะถูกสร้างแต่ไม่มีใครมาดึงเลย
  # (ตรวจได้ด้วย: kubectl get prometheus -A -o jsonpath='{.items[*].spec.serviceMonitorSelector}')
  additionalLabels:
    release: prometheus-grafana

# --- Scaling & availability ---
#
# ⚠️ ทั้งสองอย่างนี้ยังปิดอยู่โดยตั้งใจ เพราะคลัสเตอร์ตอนนี้มี node เดียว
# และ replicaCount = 1
#
# PodDisruptionBudget ที่ minAvailable: 1 บน 1 replica จะทำให้
# `kubectl drain` ค้างตลอดไป (ไม่มีทางเหลือ pod ครบตามที่ขอ) กลายเป็น
# ทำให้ maintenance ทำไม่ได้แทนที่จะช่วย — เปิดเมื่อ replicaCount >= 2 เท่านั้น
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

# HPA ต้องมี metrics-server (คลัสเตอร์นี้มีแล้ว) และ resources.requests ที่ตั้งไว้
# เปิดเมื่อพร้อมรับ pod หลายตัว — ต้องตรวจก่อนว่า rate limiter ซึ่งเก็บ state
# ในหน่วยความจำของแต่ละ pod ยังให้ผลที่ยอมรับได้เมื่อกระจายหลาย pod
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: ""

shutdown:
  # รอหลังปิด readiness ก่อนหยุดรับ connection ใหม่
  drainDelay: 5s
  # เวลาสูงสุดที่รอ request ที่ค้างอยู่ — ต้องน้อยกว่า terminationGracePeriodSeconds
  timeout: 20s

# --- Database -------------------------------------------------------------
db:
  host: postgres
  port: 5432
  name: vertex
  sslMode: disable
  schema: pet
  # ⚠️ ระหว่างย้าย schema ต้องเป็น "pet,public" และ deploy ค่านี้ให้ขึ้นก่อน
  #    แล้วค่อยรัน db/bootstrap/001_move_to_pet_schema.sql
  #    เปลี่ยนเป็น "pet" อย่างเดียวได้เมื่อ auth/event ย้ายเสร็จแล้ว
  searchPath: "pet,public"
  # Secret ที่เก็บ credential ของ runtime (สิทธิ์ DML เท่านั้น ไม่มี DDL)
  credentialsSecret: pet-db-app

# --- Flyway migration job ---
#
# ⚠️ default = false โดยตั้งใจ
#
# migration ย้ายไปอยู่ repo vertex-migrations พร้อม helm chart ของตัวเองแล้ว
# ที่นั่นรัน Flyway เป็น Job และเป็นเจ้าของ schema จริง
#
#   helm upgrade --install vertex-migrations \
#     ../vertex-migrations/helm/vertex-migrations -n vertex
#
# ถ้าเปิดตรงนี้ด้วยจะรัน migration ซ้ำสองที่ ซึ่งไม่พัง (Flyway idempotent)
# แต่ทำให้ไม่ชัดว่าใครเป็นเจ้าของ schema และ debug ยากเมื่อมีปัญหา
#
# เปิดได้ถ้าอยากให้ migration ผูกกับ deploy ของ service แบบ pre-upgrade hook
migration:
  enabled: false
  image:
    # SQL อยู่ใน repo vertex-migrations แยกต่างหาก
    repository: ghcr.io/thepphithakp/vertex-migrations
    # ⚠️ ต้องระบุ tag ชัดเจนเสมอ ห้ามเว้นว่าง
    #
    # เดิม migration image ใช้ tag เดียวกับ app image จึงตรงกันอัตโนมัติ
    # พอแยก repo แล้ว schema version กับ code version หลุดจากกัน
    # ต้องอัปเดตค่านี้ทุกครั้งที่เพิ่ม V__ ที่โค้ดพึ่งพา
    #
    # ถ้าลืม: AssertSchemaVersion จะทำให้ app ล้มตั้งแต่ boot
    # พร้อมข้อความว่าต้องรัน migration ก่อน — ปลอดภัยกว่าไปพังตอน query แรก
    tag: "latest"
  # Secret ที่เก็บ credential ของ migrator (มีสิทธิ์ DDL)
  credentialsSecret: pet-db-migrator
  # ⚠️ เปลี่ยนเป็น false หลัง prod baseline สำเร็จแล้ว
  #    เพื่อไม่ให้เผลอ baseline database ผิดตัวในอนาคต
  baselineOnMigrate: true
  backoffLimit: 1
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- JWT ------------------------------------------------------------------
jwt:
  # Secret ที่เก็บ public key ทุกใบที่ยอมรับ (คีย์ "keys" เป็น PEM ต่อกันได้หลายใบ)
  # เว้นว่าง = อ่านจากไฟล์ใน image เหมือนเดิม
  # ระหว่าง rotate ให้ใส่ทั้งใบเก่าและใบใหม่ — ดู docs/KEY_ROTATION.md
  publicKeysSecret: "jwt-public-keys"
  issuer: ""
  audience: ""

# --- Event service --------------------------------------------------------
#
# event-service ปฏิเสธ request ที่ไม่มี X-Service-Token
# ต้องเป็น Secret เดียวกับที่ event-service ถือ ไม่งั้น event หายเงียบๆ
# (request ของผู้ใช้ยังทำงานปกติ เพราะการส่ง event เป็น fire-and-forget)
event:
  ingestTokenSecret: event-ingest-token

# --- Pet list / avatar ----------------------------------------------------
#
# GET /pets เดิมส่ง avatarData ไปกับทุกรายการ ซึ่งบน production แปลว่า
# ผู้ใช้ที่มีสัตว์เลี้ยง 3 ตัว (รูปรวม 3.7MB) ต้องโหลดหลายเมกะไบต์ทุกครั้งที่เปิดหน้ารายการ
#
# วัดจากเทสต์บนฐานข้อมูลจริง: สัตว์เลี้ยง 1 ตัวรูป 512KB
#   มีรูปในรายการ  699,425 ไบต์
#   ไม่มีรูป            374 ไบต์
#
# ปิดแล้วเมื่อ 2026-08-23 หลังแอป iOS เปลี่ยนไปใช้ GET /pets/:id/avatar
# (vertex-app commit 6f3572b — build ลงเครื่องจริงและทดสอบแล้ว)
#
# เปิดกลับเป็น true ได้ทันทีถ้ามีปัญหา — ไม่ต้อง build ใหม่ แค่แก้ค่านี้แล้ว deploy
# แอปเวอร์ชันใหม่รองรับทั้งสองแบบ จึงสลับไปมาได้อย่างปลอดภัย
petList:
  includeAvatar: false

# --- Database connection pool --------------------------------------------
#
# ค่า default ของ database/sql คือเปิดได้ไม่จำกัด ตอน traffic พุ่ง pod เดียว
# อาจกิน max_connections ของ postgres (ตั้งไว้ 100) จนทุก service ต่อไม่ได้พร้อมกัน
#
# 3 service × 20 = 60 เหลือที่ให้ Flyway Job และการต่อด้วยมือ
dbPool:
  maxOpenConns: 20
  maxIdleConns: 10
  connMaxLifetime: 30m
  connMaxIdleTime: 5m

# --- Application env ------------------------------------------------------
env:
  - name: EVENT_SERVICE_URL
    value: "http://event-service:4002"
  - name: LOG_LEVEL
    value: "info"
